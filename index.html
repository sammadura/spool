<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#120e0a" />
  <title>Spool</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%23120e0a' width='32' height='32'/%3E%3Ccircle cx='10' cy='16' r='6' fill='%237a3d22' stroke='%23b8924a' stroke-width='1.5'/%3E%3Ccircle cx='22' cy='16' r='6' fill='%237a3d22' stroke='%23b8924a' stroke-width='1.5'/%3E%3Cpath d='M16 12c2 2 2 6 0 8' stroke='%236b3a22' stroke-width='2' fill='none'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,620&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="glow" aria-hidden="true"></div>
  <div id="shade" aria-hidden="true"></div>

  <main id="shop" hidden>
    <header class="mast">
      <p class="kicker">night workshop</p>
      <h1>Spool</h1>
      <p class="note">click a reel to splice a new loop</p>
      <button type="button" id="still" aria-pressed="false">Still</button>
    </header>
    <section id="deck" aria-label="four tape spools"></section>
  </main>

  <div id="gate">
    <div class="gate-card">
      <p class="kicker">night workshop</p>
      <h1>Spool</h1>
      <p class="line">four reels on a dark bench, oxide still warm</p>
      <button type="button" id="wind">Wind</button>
    </div>
  </div>

  <script src="audio.js"></script>
  <script src="ui.js"></script>
  <script src="app.js"></script>
</body>
</html>
